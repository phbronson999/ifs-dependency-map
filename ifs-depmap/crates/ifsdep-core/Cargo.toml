[package]
name = "ifsdep-core"
version = "0.3.0"
edition = "2021"
description = "Indexes IFS Cloud Core + Cust source folders into a dependency graph and flags problems"

# Deliberately dependency-free: std only. The JSON writer, folder walk and
# cycle detection are small enough to own.

[lib]
name = "ifsdep_core"

[[bin]]
name = "ifsdep"
path = "src/bin/ifsdep.rs"

[[bin]]
name = "ifsdep-ai"
path = "src/bin/ifsdep-ai.rs"

[dependencies]
